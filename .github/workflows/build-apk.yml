name: Build APK offline (Meus Gastos)
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurar Java (necessário pro Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configurar Android SDK
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Instalar dependências do projeto
        run: npm ci

      - name: Adicionar plataforma Android (se ainda não existir)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Gerar o ícone do app (resources/icon.png)
        run: npx capacitor-assets generate --android --assetPath resources --iconBackgroundColor "#110e26" --iconBackgroundColorDark "#110e26"

      - name: Gerar o APK (debug, pronto pra instalar)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar o APK pra download
        uses: actions/upload-artifact@v4
        with:
          name: meus-gastos-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
