<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meus gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>

:root[data-theme="dark"]{--bg:#0e0c1c;--card:#181630;--ink:#ecebf8;--mut:#9b99b8;--line:#2a2750;--acc:#a9a3ff;--btn:#5b50e6;--ok:#3fd1a1;--bad:#ff8b94;--blue:#a9a3ff;--h1:#2b2478;--h2:#5144d6;--sh:0 1px 2px #0006,0 8px 22px -12px #000b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 'Inter',system-ui,sans-serif;font-variant-numeric:tabular-nums}
.w{max-width:760px;margin:0 auto;padding:20px 16px 120px}
h1,h2,.big,.pm b,.dc b{font-family:'Manrope','Inter',system-ui,sans-serif;margin:0}
h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
h2{font-size:16px;font-weight:700;margin-bottom:12px;letter-spacing:-.01em}
.mn{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:5px;box-shadow:var(--sh)}
.mn b{font-size:15px;font-weight:600}
.ar{border:0;background:none;color:var(--ink);width:40px;height:40px;border-radius:12px;font-size:20px;cursor:pointer}
.ar:hover,.ar:active{background:var(--bg)}
.hj{border:0;background:none;color:var(--acc);font:600 12px inherit;cursor:pointer}
.ticket{display:grid;grid-template-columns:1.2fr 1fr;color:#fff;background:linear-gradient(135deg,var(--h1),var(--h2));border-radius:20px;overflow:hidden;box-shadow:0 16px 30px -16px #241c6bcc}
.ticket.neg .big{color:#ffc2cc}
.ticket .l{padding:22px 22px 20px}
.ticket .r{padding:22px;border-left:1px solid #ffffff2e;display:flex;flex-direction:column;justify-content:center;gap:2px}
.ticket .lab{color:#ffffffb8}
.ticket .row b{font-weight:600}
.lab{color:var(--mut);font-size:13px}
.big{font-size:36px;font-weight:800;line-height:1.15;color:var(--ok);letter-spacing:-.03em;margin:4px 0}
.ticket .big{color:#fff}
.big.neg{color:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:3px 0}
.d{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}
.d.up{background:#5fe0b5}.d.dn{background:#ff9fb4}
.pb{height:6px;border-radius:6px;background:#ffffff2e;margin:12px 0 6px;overflow:hidden}
.pb i{display:block;height:100%;background:#ff9cc2;border-radius:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.pm{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--sh)}
.pm>div{min-width:0}
.pm b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.pi2{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--acc);background:color-mix(in srgb,var(--acc) 11%,transparent)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px;box-shadow:var(--sh)}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px}
.sh h2{margin:0}
.chart{display:grid;gap:18px;justify-items:center}
.dw{position:relative;width:min(240px,70vw);aspect-ratio:1}
.dw svg{width:100%;height:100%;display:block;touch-action:none;cursor:pointer;overflow:visible}
.sl{transition:stroke-width .18s ease,opacity .18s ease;stroke-width:24}
.dc{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;pointer-events:none;padding:0 24%;gap:2px}
.dc b{font-size:20px;font-weight:800;letter-spacing:-.02em}
.dc small{color:var(--mut);font-size:12px;line-height:1.25}
.leg{width:100%;display:grid;gap:2px}
.lg{display:flex;align-items:center;gap:10px;font-size:14px;padding:9px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:background .15s}
.lg.on{background:var(--bg);border-color:var(--line)}
.lg .pc{color:var(--mut);font-size:12px;margin-left:auto}
.lg b{min-width:88px;text-align:right;font-weight:600}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.it{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.sh+.it,.dh+.it{border-top:0}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none}
.it .n{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.it .n small{display:block;color:var(--mut);font-weight:400;font-size:12.5px}
.it b{font-weight:600;white-space:nowrap}
.tg{display:inline-block;margin-right:7px;padding:1px 8px;border-radius:999px;font:600 11px/1.5 'Inter',sans-serif;font-style:normal;vertical-align:1px;white-space:nowrap;color:var(--mut);border:1px solid var(--line)}.tg.p{color:var(--acc);border-color:transparent;background:color-mix(in srgb,var(--acc) 15%,transparent)}
.cl .it{gap:8px}.cl .ic{width:34px;height:34px;font-size:16px;border-radius:10px}.cl .x{padding:6px 3px}.cl .it .n{overflow-wrap:break-word}.cl .ck{width:20px;height:20px}
.it.done .n{opacity:.55;text-decoration:line-through}
.ck{width:22px;height:22px;flex:none;accent-color:var(--ok)}
.x{border:0;background:none;color:var(--mut);cursor:pointer;font-size:16px;padding:6px 8px;border-radius:8px}
.x:hover,.x:focus-visible{color:var(--bad)}
.x.e:hover,.x.e:focus-visible{color:var(--blue)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .f{grid-column:1/-1}
label{display:grid;gap:5px;color:var(--mut);font-size:13px;font-weight:500}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;min-width:0}
input[type=color]{padding:2px;height:42px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{margin-top:14px;width:100%;border:0;background:var(--btn);color:#fff;font:600 15px inherit;padding:13px;border-radius:12px;cursor:pointer}
.btn:active{opacity:.9}
.btn.g{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;font:500 13px inherit;cursor:pointer}
.chip:hover{border-color:var(--acc)}
.empty{color:var(--mut);padding:8px 0}
.bar{height:8px;border-radius:8px;background:var(--line);margin:10px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px}
.cd{border-left:5px solid var(--acc)}
.dh{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;font-weight:500;padding-top:14px}
nav{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:740px;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:5px;box-shadow:var(--sh);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:8px 0 6px;border-radius:15px;font:500 11px inherit;cursor:pointer;display:grid;gap:3px;justify-items:center}
nav button svg{width:22px;height:22px}
nav button em{font-style:normal}
nav button.on{color:var(--acc);font-weight:600;background:color-mix(in srgb,var(--acc) 12%,transparent)}
.ov{position:fixed;inset:0;background:#08061aa6;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.ov[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.chart{grid-template-columns:240px 1fr;align-items:center}.big{font-size:40px}}
@media (max-width:520px){.ticket{grid-template-columns:1fr}.ticket .r{border-left:0;border-top:1px solid #ffffff2e}.pm b{font-size:15px}}
@media (prefers-reduced-motion:reduce){.sl,.lg{transition:none}}
.pill{display:flex;align-items:center;gap:8px;width:100%;border:1px dashed var(--line);background:color-mix(in srgb,var(--acc) 8%,transparent);color:var(--ink);border-radius:10px;padding:8px 11px;font:500 13px inherit;cursor:pointer;text-align:left}.pill em{margin-left:auto;font-style:normal;color:var(--acc);font-size:12px}
</style>
</head>
<body>
<div class="w"><div id="hd"></div><div id="main"></div></div>
<nav id="nav"></nav>

<script>

['div','\\b(financiamento|emprestimo|consignado|divida)'],

].map(function(x){return[x[0],new RegExp(x[1])]});

 if(o)Object.assign(o,r);else{r.id=S.seq++;({item:S.items,inc:S.inc,card:S.cards,day:S.day})[t].push(r)}
 save();$('ov').hidden=true;render()}
function remove(t,id){
 var o=find(t,id),l={item:S.items,inc:S.inc,card:S.cards,day:S.day}[t];
 if(t!=='day'&&!confirm(t==='card'?'Remover o cartão "'+o.n+'"? As compras dele passam para Pix/débito.':((o.t==='rec'||o.t==='year')&&o.s<S.m)?'Parar de cobrar "'+o.n+'" a partir de '+ML(S.m)+'? Os meses anteriores continuam.':'Remover "'+o.n+'"?'))return;
 if(t==='card'){S.items.concat(S.day).forEach(function(x){if(x.p==='card:'+o.id)x.p='avulso'})}
 if((t==='item'||t==='inc')&&(o.t==='rec'||o.t==='year')&&o.s<S.m)o.e=S.m;else l.splice(l.indexOf(o),1);
 save();render()}

 else if(a==='ch'){var x=CI[+d.i];fill('f_n',x[0]);fill('f_c',x[1])}
 else if(a==='cr')fill('f_n',CR[+d.i]);
 else if(a==='tc'){var l=$(d.p+'_cl');l.style.display=l.style.display==='none'?'grid':'none'}
 else if(a==='cd'){var y=CD[+d.i];fill('h_n',y[0]);fill('h_c',y[1]);$('h_v').focus()}
 else if(a==='hadd'){var v=parseFloat($('h_v').value),n=$('h_n').value.trim();
  if(!n){$('h_n').focus();return}if(isNaN(v)||v<0){$('h_v').focus();return}
  S.day.push({id:S.seq++,n:n,v:v,c:$('h_c').value,p:$('h_p').value,d:$('h_d').value||TD});save();render();$('h_n').focus()}
 else if(a==='nc'){var cn=$('cn').value.trim();if(!cn){$('cn').focus();return}
  S.cats['c'+Date.now()]=[cn,$('ce').value.trim()||'🏷️',COR[Object.keys(S.cats).length%COR.length]];save();render()}
 else if(a==='rc'){if(!confirm('Remover a categoria? Gastos dela passam para "Outros".'))return;
  S.items.concat(S.day).forEach(function(x){if(x.c===d.k)x.c='outro'});delete S.cats[d.k];save();render()}
 else if(a==='bk'){var j=JSON.stringify(S);if(navigator.clipboard)navigator.clipboard.writeText(j).then(function(){alert('Backup copiado! Cole em um lugar seguro (notas, e-mail).')},function(){prompt('Copie o backup:',j)});else prompt('Copie o backup:',j)}
 else if(a==='rs'){var t=prompt('Cole aqui o backup:');if(!t)return;try{var j=JSON.parse(t);if(!j.cats||!j.items)throw 0;S=j;mig();S.m=NOW;S.tab='ajustes';save();render()}catch(x){alert('Backup inválido.')}}
 else if(a==='wipe'){if(confirm('Apagar TODOS os dados deste aparelho? Não dá para desfazer.')){S=def();S.m=NOW;S.tab='res';save();render()}}});

 var g=GUESS(e.target.value)||(id==='h_n'||e.target.dataset.k==='day'?'comida':'outro');if(S.cats[g])cs.value=g;updPill(id==='h_n'?'h':'f')});
